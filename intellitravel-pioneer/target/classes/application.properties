spring.application.name=intellitravel-pioneer

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/intellitravel?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# AI trip planning service configuration
trip.ai.provider=llm

# SiliconFlow API configuration
trip.ai.llm.base-url=https://api.siliconflow.cn
# trip.ai.llm.base-url=http://1.95.125.250:8081
trip.ai.llm.chat-path=/v1/chat/completions
trip.ai.llm.api-key=${SILICONFLOW_API_KEY:***REMOVED***}
# trip.ai.llm.model=Qwen/Qwen3-8B
# trip.ai.llm.model=travelagent67-v2
trip.ai.llm.model=Pro/zai-org/GLM-5

trip.ai.llm.temperature=0.2

# Image Generation Configuration
trip.ai.image.model=Kwai-Kolors/Kolors
trip.ai.image.path=/v1/images/generations
trip.ai.image.size=1024x1024

# Amap official API configuration (used by HttpMapApiClient)
amap.key=${AMAP_KEY:f1964afb46d426d70f8f4dc46cdb73a3}
amap.geocode-url=https://restapi.amap.com/v3/geocode/geo
amap.weather-url=https://restapi.amap.com/v3/weather/weatherInfo
amap.static-map-url=https://restapi.amap.com/v3/staticmap

# File upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

aliyun.oss.endpoint=oss-cn-shanghai.aliyuncs.com
aliyun.oss.access-key-id=${OSS_ACCESS_KEY_ID:***REMOVED***}
aliyun.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET:***REMOVED***}
aliyun.oss.bucket-name=bluewhale-lsw