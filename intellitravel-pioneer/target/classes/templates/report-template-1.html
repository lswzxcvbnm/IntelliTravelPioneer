<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>行程战报</title>
    <style>
        body { width: 375px; height: 667px; margin: 0; padding: 0; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .poster { position: relative; width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        
        /* ======== 4种主题的全局背景 ======== */
        /* 1. 自然 (Nature) */
        .poster.theme-nature { background: linear-gradient(135deg, #e0f2f1 0%, #a5d6a7 100%); color: #1b5e20; }
        .poster.theme-nature .card { background: rgba(255, 255, 255, 0.85); box-shadow: 0 8px 32px rgba(27, 94, 32, 0.1); border-radius: 20px; }
        .poster.theme-nature h2 { border-bottom: 2px solid #81c784; }
        .poster.theme-nature .power { color: #43a047; }
        
        /* 2. 都市 (City) */
        .poster.theme-city { background: linear-gradient(135deg, #2c3e50 0%, #000000 100%); color: #eceff1; }
        .poster.theme-city .card { background: rgba(30, 40, 50, 0.8); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); border-radius: 8px; border: 1px solid #455a64; color: #eceff1;}
        .poster.theme-city h2 { border-bottom: 2px solid #546e7a; letter-spacing: 2px; }
        .poster.theme-city .power { color: #00bcd4; text-shadow: 0 0 10px rgba(0, 188, 212, 0.5); }
        .poster.theme-city .stat-item { color: #cfd8dc; }

        /* 3. 文艺 (Art) */
        .poster.theme-art { background: #faf3e0; color: #5d4037; font-family: 'KaiTi', 'STKaiti', serif; }
        .poster.theme-art .card { background: transparent; border: 1px dashed #bcaaa4; border-radius: 0; padding: 30px 10px; }
        .poster.theme-art h2 { border-bottom: 1px solid #8d6e63; font-weight: normal; font-style: italic; }
        .poster.theme-art .power { color: #d84315; font-size: 28px; }
        .poster.theme-art .map-wrapper { padding: 10px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transform: rotate(-2deg); }

        /* 4. 复古 (Retro) */
        .poster.theme-retro { background: #d7ccc8; color: #3e2723; }
        .poster.theme-retro .card { background: #efebe9; border-radius: 5px; border: 4px double #8d6e63; box-shadow: inset 0 0 20px rgba(141, 110, 99, 0.2); }
        .poster.theme-retro h2 { border-bottom: none; text-shadow: 1px 1px 0px #bcaaa4; font-family: 'SimSun', 'STSong', serif; }
        .poster.theme-retro .power { color: #bf360c; }
        .poster.theme-retro .map-img { filter: sepia(0.6) contrast(1.2) brightness(0.9); border: 2px solid #5d4037; }


        /* ======== 通用布局 ======== */
        .header { margin-top: 30px; margin-bottom: 20px; text-align: center; width: 100%; }
        .header-title { font-size: 28px; font-weight: bold; margin: 0; }
        .header-subtitle { font-size: 14px; opacity: 0.8; margin-top: 5px; }

        .map-wrapper { width: 90%; margin: 0 auto 20px; border-radius: 12px; overflow: hidden; z-index: 10; }
        .map-img { width: 100%; height: 240px; object-fit: cover; display: block; }
        
        .card { width: 85%; padding: 25px 20px; margin-bottom: 20px; backdrop-filter: blur(10px); }
        h2 { text-align: center; padding-bottom: 10px; margin-top: 0; margin-bottom: 25px; font-size: 22px; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: center; }
        .stat-item { display: flex; flex-direction: column; font-size: 14px; opacity: 0.9; }
        .stat-value { font-size: 24px; font-weight: bold; margin-top: 8px; font-family: 'Impact', sans-serif; }
        .stat-value.power { font-size: 32px; }

        .footer { position: absolute; bottom: 20px; font-size: 12px; opacity: 0.6; width: 100%; text-align: center; }
    </style>
</head>
<body>
    <!-- 动态赋予主题 class: theme-nature, theme-city, theme-art, theme-retro -->
    <div th:class="'poster theme-' + ${theme}">
        
        <div class="header">
            <h1 class="header-title">IntelliTravel</h1>
            <div class="header-subtitle">每一次出发，都是全新的探索</div>
        </div>

        <!-- 轨迹图 -->
        <div class="map-wrapper">
            <img th:src="${trajectoryUrl}" class="map-img" alt="轨迹地图"/>
        </div>
        
        <div class="card">
            <h2>探索者战报</h2>
            
            <div class="stat-grid">
                <div class="stat-item">
                    <span>累计步数(步)</span>
                    <span class="stat-value" th:text="${steps}">0</span>
                </div>
                <div class="stat-item">
                    <span>行程耗时(分钟)</span>
                    <span class="stat-value" th:text="${durationMin}">0</span>
                </div>
                <div class="stat-item" style="grid-column: span 2; margin-top: 10px;">
                    <span>消耗战力</span>
                    <span class="stat-value power" th:text="${powerCost}">0</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
